# Netlify hosts apps/web (Next.js). The mobile app is built with EAS.
[build]
  base = "/"
  command = "npm run build -w @qam/web"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"

[functions]
  directory = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/api/public/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-Api-Key"

# Android test build: short link to the latest APK published on the apk-builds branch.
[[redirects]]
  from = "/android.apk"
  to = "https://github.com/Johnsamir86/Quran-and-more/raw/apk-builds/quran-and-more-android.apk"
  status = 302
  force = true
